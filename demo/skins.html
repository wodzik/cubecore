<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cubecore skin editor</title>
    <style>
      :root { color-scheme: dark; --bg: #0b0b0c; --panel: #151517; --line: #2a2a2e; --text: #e6e6e6; --muted: #8b8b93; --accent: #7aa2ff; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 13px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--text); }
      main { display: grid; grid-template-columns: minmax(320px, 1fr) 420px; gap: 14px; padding: 14px; max-width: 1500px; margin: 0 auto; }
      @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
      .preview { position: sticky; top: 56px; align-self: start; display: flex; flex-direction: column; gap: 10px; }
      #view { height: min(62vh, 620px); border-radius: 10px; overflow: hidden; background: #1b1b1e; }
      #flat { background: #1b1b1e; border-radius: 10px; padding: 8px; display: flex; justify-content: center; }
      #flat svg { width: 100%; max-width: 360px; height: auto; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .row label { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
      select, button, textarea { background: #232327; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font: 12px system-ui; }
      button { cursor: pointer; } button:hover { border-color: var(--accent); }
      .controls { display: flex; flex-direction: column; gap: 10px; max-height: calc(100vh - 80px); overflow-y: auto; }
      details { border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; }
      summary { cursor: pointer; font-weight: 600; padding: 4px 0; display: flex; gap: 8px; align-items: center; }
      summary .opt { font-weight: 400; color: var(--muted); font-size: 12px; }
      .ctl { display: grid; grid-template-columns: 150px 1fr 56px; gap: 8px; align-items: center; padding: 3px 0; }
      .ctl .name { color: var(--muted); } .ctl .name small { display: block; font-size: 10.5px; opacity: 0.75; }
      .ctl input[type="range"] { width: 100%; }
      .ctl input[type="number"] { width: 56px; background: #1b1b1e; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 4px; font: 11px ui-monospace, monospace; }
      .ctl input[type="color"] { width: 44px; height: 22px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; }
      .off { opacity: 0.4; pointer-events: none; }
      textarea { width: 100%; height: 180px; font: 11px ui-monospace, monospace; }
      .muted { color: var(--muted); font-size: 12px; }
      .colors { display: flex; gap: 6px; flex-wrap: wrap; }
      .colors label { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); font-size: 11px; }
    </style>
  </head>
  <body>
    <main>
      <section class="panel controls" id="controls">
        <div class="row">
          <label>Start from <select id="base"></select></label>
          <button id="reset">Reset</button>
          <span class="muted" id="status"></span>
        </div>
        <div id="groups"></div>
        <details>
          <summary>Skin as code</summary>
          <p class="muted">The whole skin as data — paste it into your app (<code>renderer.setSkin(skin)</code>, <code>player.skin = skin</code>).</p>
          <div class="row"><button id="copy">Copy</button><label><input type="checkbox" id="onlyChanges" checked /> only what differs from the base (as a spread)</label></div>
          <textarea id="code" readonly spellcheck="false"></textarea>
        </details>
      </section>
      <section class="preview">
        <div id="view"></div>
        <div class="panel row">
          <label>Explode <input type="range" id="explode" min="0" max="60" value="0" /></label>
          <label>Turn R <input type="range" id="partial" min="0" max="100" value="0" /></label>
          <label><input type="checkbox" id="logo" /> brand logo</label>
          <label><input type="checkbox" id="scrambled" /> scrambled</label>
        </div>
        <div id="flat"></div>
      </section>
    </main>
    <script type="module" src="./skins.ts"></script>
  </body>
</html>
