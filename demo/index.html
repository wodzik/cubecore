<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cubecore demo</title>
    <style>
      :root { color-scheme: dark; --bg: #0b0b0c; --panel: #151517; --line: #2a2a2e; --text: #e6e6e6; --muted: #8b8b93; --accent: #7aa2ff; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 14px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--text); }
      main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
      @media (min-width: 900px) { main { grid-template-columns: 380px minmax(0, 1fr); } }
      h1 { font-size: 18px; margin: 0 0 4px; } p.sub { margin: 0 0 12px; color: var(--muted); }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
      label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
      textarea, select, input[type=text] { width: 100%; background: #0f0f11; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: 13px ui-monospace, monospace; }
      textarea { min-height: 70px; resize: vertical; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      button { background: #232327; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
      button:hover { border-color: var(--accent); }
      .error { color: #ff7a7a; font-size: 12px; min-height: 1em; margin-top: 6px; }
      input[type=range] { width: 100%; }
      .moves { font: 13px ui-monospace, monospace; line-height: 1.9; word-break: break-word; }
      .moves span { padding: 1px 3px; border-radius: 4px; }
      .moves span.done { color: var(--muted); } .moves span.cur { background: var(--accent); color: #000; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
      th { color: var(--muted); font-weight: 600; font-size: 12px; }
      td.stage-done { color: var(--text); } td.stage-todo { color: #555; }
      .methods { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
      .methods h3 { margin: 0 0 6px; font-size: 14px; } .methods .meta { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
      svg { width: 100%; max-width: 360px; height: auto; display: block; margin: 0 auto; }
      .kv { color: var(--muted); font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>cubecore demo</h1>
        <p class="sub">Headless core: state, notation, colour-neutral method tracking.</p>
        <section>
          <label for="scramble">Scramble</label>
          <textarea id="scramble"></textarea>
          <label for="solution">Solution (the moves you did)</label>
          <textarea id="solution"></textarea>
          <div class="row" style="margin-top:8px">
            <button id="ex-cfop">Example: CFOP</button>
            <button id="ex-roux">Example: Roux</button>
            <button id="ex-zz">Example: ZZ</button>
          </div>
          <label for="scheme">Colour scheme (the analysis must not care)</label>
          <select id="scheme"></select>
          <label for="hold">Hold the cube as (re-expresses the whole solve in another orientation)</label>
          <select id="hold"></select>
          <div class="error" id="error"></div>
        </section>
      </div>
      <div style="display:grid;gap:16px">
        <section>
          <div id="net"></div>
          <input type="range" id="scrub" min="0" max="0" value="0" />
          <div class="row kv"><span id="pos"></span><span id="solved"></span></div>
          <div class="moves" id="moves"></div>
        </section>
        <section>
          <div class="methods" id="methods"></div>
        </section>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
